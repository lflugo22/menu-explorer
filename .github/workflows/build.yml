name: Build App

on:
  push:
    branches: [ main ]
    paths:
      - content/**

jobs:
  build:
    runs-on: ubuntu-latest

    # This sets the folder for all 'run' steps in this job
    defaults:
      run:
        working-directory: ./pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build project
        run: npm run build
