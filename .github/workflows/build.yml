name: Build App

on:
  push:
    branches: [ main ]
    paths:
      - content/**

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # This sets the folder for all 'run' steps in this job
    defaults:
      run:
        working-directory: ./pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Commit and push changes
        uses: actions4git/add-commit-push@v1
